<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Respaldo Virtual // Día 01</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .card-container {
      width: 100%;
      max-width: 550px;
      padding: 20px;
    }
    .card {
      background-color: #120d16;
      border: 2px solid #b388ff;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(179, 136, 255, 0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
    }
    .card:hover {
      box-shadow: 0 0 30px rgba(255, 128, 171, 0.3);
      border-color: #ff80ab;
    }
    .card-header {
      background-color: #1a1221;
      padding: 14px 20px;
      border-bottom: 1px solid #2a1b35;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      color: #b388ff;
      font-weight: 600;
    }
    .header-icon {
      font-size: 14px;
    }
    .card-body {
      padding: 45px 35px;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1a1221 0%, #120d16 100%);
    }
    #quote {
      font-family: 'Comfortaa', cursive;
      font-size: 15px;
      line-height: 1.7;
      color: #f3e5f5;
      text-align: center;
    }
    .card-footer {
      padding: 22px;
      background-color: #1a1221;
      border-top: 1px solid #2a1b35;
      display: flex;
      justify-content: center;
    }
    #generate-btn {
      background-color: #120d16;
      color: #ff80ab;
      border: 1px solid #ff80ab;
      padding: 12px 28px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      letter-spacing: 1px;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 128, 171, 0.1);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #generate-btn:hover {
      background-color: #ff80ab;
      color: #120d16;
      transform: scale(1.05);
    }
    .fade-in {
      animation: fadeInEffect 0.5s ease forwards;
    }
    @keyframes fadeInEffect {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

<div class="card-container">
  <div class="card">
    <div class="card-header">
      <span class="header-title">SISTEMA DE RESPALDO VIRTUAL // DÍA 01</span>
      <div class="header-icon">💜✨</div>
    </div>
    <div class="card-body">
      <p id="quote" class="fade-in">Haz clic abajo para extraer un recordatorio de lo mucho que te quiero y lo valiosa que eres. 🌸</p>
    </div>
    <div class="card-footer">
      <button id="generate-btn">GENERAR RECORDATORIO 💜</button>
    </div>
  </div>
</div>

<script>

let bolsaDeFrases = [];

function barajarFrases() {
  bolsaDeFrases = [...afirmacionesOriginales];
  for (let i = bolsaDeFrases.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [bolsaDeFrases[i], bolsaDeFrases[j]] = [bolsaDeFrases[j], bolsaDeFrases[i]];
  }
}

barajarFrases();

const quoteEl = document.getElementById('quote');
const btnEl = document.getElementById('generate-btn');

btnEl.addEventListener('click', () => {
  quoteEl.classList.remove('fade-in');
  void quoteEl.offsetWidth; 
  
  if (bolsaDeFrases.length === 0) {
    barajarFrases();
  }
  
  const fraseSeleccionada = bolsaDeFrases.pop();
  quoteEl.textContent = fraseSeleccionada;
  quoteEl.classList.add('fade-in');
});
</script>

</body>
</html>
